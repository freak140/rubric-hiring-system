<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubric</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="antialiased bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 mb-2">
        <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white text-sm font-bold flex items-center justify-center">R</span>
        <span class="text-2xl font-semibold tracking-tight">Rubric</span>
      </div>
      <p class="text-gray-500">Every hire, one standard.</p>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-5 mb-4">
      <p class="font-semibold mb-1">Explore the demo</p>
      <p class="text-sm text-gray-500 mb-4">
        Freely switch between every role (chairman, principal, interviewer, HR) with no password.
        Best for a first look or a quick tour.
      </p>
      <form method="post" action="/demo/enter">
        <button type="submit" class="w-full bg-indigo-600 text-white font-medium px-4 py-2.5 rounded-lg hover:bg-indigo-700">
          Continue in demo mode
        </button>
      </form>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-5">
      <p class="font-semibold mb-1">Log in</p>
      <p class="text-sm text-gray-500 mb-4">
        Sign in as one real user and see only your own panel -- no role switching.
      </p>
      <a
        href="/login"
        class="block text-center w-full border border-gray-300 text-gray-700 font-medium px-4 py-2.5 rounded-lg hover:bg-gray-50"
      >
        Log in
      </a>
    </div>
  </div>
</body>
</html>
