{% extends "base.html" %}
{% block title %}Log in · Rubric{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-8">
  <h1 class="text-2xl font-bold tracking-tight mb-1 text-center">Log in</h1>
  <p class="text-sm text-gray-500 mb-6 text-center">Normal mode: see only your own panel, no role switching.</p>

  <form method="post" action="/login" class="bg-white border border-gray-200 rounded-lg shadow-sm p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input
        type="email" name="email" required autofocus
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
      >
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input
        type="password" name="password" required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
      >
    </div>
    <button type="submit" class="w-full bg-indigo-600 text-white font-medium px-4 py-2 rounded-lg hover:bg-indigo-700">
      Log in
    </button>
  </form>

  <p class="text-sm text-gray-400 text-center mt-4">
    Just exploring? <a href="/" class="text-indigo-700 hover:underline">Go back to demo mode</a> instead.
  </p>
</div>
{% endblock %}
